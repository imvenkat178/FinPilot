name: Verify FinPilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FINPILOT_LLM_BASE_URL: http://127.0.0.1:1/v1
      FINPILOT_LLM_MODEL: ""
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Financial, API, conversation and migration tests
        run: python -m pytest tests -q
      - name: Authenticated web render contracts
        run: python scripts/test_web.py
