<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinPilot roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f8f9fb;--surface:#ffffff;--ink:#1e2531;--muted:#657080;--line:#e6e9ee;--line-strong:#d5dae2;
  --accent:#5b4cc4;--accent-soft:#efedfb;
  --good:#24775e;--good-soft:#e9f5ef;--warn:#946018;--warn-soft:#fff4e3;
  --info:#577bb4;--info-soft:#eef3fa;--crit:#b3403a;--crit-soft:#fcecea;
  --sans:Inter,"Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141b;--surface:#181c25;--ink:#e5e8ef;--muted:#9aa3b3;--line:#262c38;--line-strong:#343c4b;
  --accent:#a49af2;--accent-soft:#252241;--good:#63c39c;--good-soft:#14281f;--warn:#dcaa60;--warn-soft:#2c2314;
  --info:#93b3e3;--info-soft:#18212f;--crit:#ec8a83;--crit-soft:#321a1a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11141b;--surface:#181c25;--ink:#e5e8ef;--muted:#9aa3b3;--line:#262c38;--line-strong:#343c4b;
  --accent:#a49af2;--accent-soft:#252241;--good:#63c39c;--good-soft:#14281f;--warn:#dcaa60;--warn-soft:#2c2314;
  --info:#93b3e3;--info-soft:#18212f;--crit:#ec8a83;--crit-soft:#321a1a;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:20px;padding-block:32px 64px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
code,.id,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-size:.86em;background:var(--accent-soft);color:var(--ink);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header{display:grid;gap:10px}
header h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:68ch}
.progress{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;font-size:14px}
.progress b{font-size:18px}
.bands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.band[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.band h2{font-size:15px;font-weight:600}
.band .def{font-size:13px;color:var(--muted)}
.band .stats{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.band .stats .num{font-size:22px;color:var(--ink);display:block;line-height:1.1}
.band .stats .p0{color:var(--crit)}
.mix{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.mix span{display:block;height:100%}
.decisions{background:var(--accent-soft);border-radius:10px;padding:18px 20px;display:grid;gap:12px}
.decisions h2{font-size:17px}
.decisions ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.decisions li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:baseline;font-size:14px}
.decisions li button{all:unset;cursor:pointer;color:var(--accent);font-family:var(--mono);font-weight:600}
.decisions li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:2;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type="search"]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px}
input[type="search"]{flex:1 1 200px;min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.group{display:grid;gap:8px}
.group>h2{font-size:19px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group>h2 small{font-size:13px;color:var(--muted);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 14px;padding:12px 16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .id{font-size:13px;font-weight:600;color:var(--accent)}
summary .title{font-weight:500}
summary .goal{display:block;font-size:12px;color:var(--muted)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.prio{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line-strong);color:var(--muted)}
.prio.P0{color:var(--crit);border-color:currentColor}
.s-todo{background:var(--line);color:var(--ink)}
.s-doing{background:var(--info-soft);color:var(--info)}
.s-blocked{background:var(--crit-soft);color:var(--crit)}
.s-decision{background:var(--accent-soft);color:var(--accent)}
.s-done{background:var(--good-soft);color:var(--good)}
.s-dropped{background:var(--line);color:var(--muted);text-decoration:line-through}
.tasks-n{font-size:12px;color:var(--muted)}
.body{padding:2px 16px 16px 94px;display:grid;gap:10px;font-size:14px}
.body dl{margin:0;display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px}
.body dt{color:var(--muted);font-size:13px}
.body dd{margin:0;max-width:75ch}
.body ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.body li{display:grid;grid-template-columns:18px 64px minmax(0,1fr);gap:8px;align-items:baseline}
.box{width:14px;height:14px;border:1.5px solid var(--line-strong);border-radius:3px;display:inline-block;transform:translateY(2px)}
.box.on{background:var(--good);border-color:var(--good)}
.body li .id{font-size:12px;color:var(--muted)}
.needs button{all:unset;cursor:pointer;font-family:var(--mono);color:var(--accent);margin-right:8px}
.empty{padding:24px;color:var(--muted);text-align:center}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px;max-width:75ch}
@media (max-width:720px){
  .bands{grid-template-columns:1fr}
  summary{grid-template-columns:52px minmax(0,1fr)}
  .meta{grid-column:2;justify-content:flex-start}
  .body{padding-left:16px}
  .body dl{grid-template-columns:1fr}
  .decisions li{grid-template-columns:52px 1fr}
  .decisions li .tag{grid-column:2}
  .count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Goal tree</span>
    <h1>FinPilot roadmap</h1>
    <p id="intro">Long-term goals, their sub-goals and tasks, classified by horizon. Generated from <code>ROADMAP.md</code> by <code>scripts/roadmap.py write</code>. Edit that file, not this page.</p>
    <div class="progress" id="progress"></div>
  </header>

  <section class="bands" id="bands" aria-label="Horizons"></section>

  <section class="decisions" aria-labelledby="dec-title">
    <h2 id="dec-title">Decisions waiting on you</h2>
    <ol id="decisions"></ol>
  </section>

  <div class="controls" role="toolbar" aria-label="Filter the roadmap">
    <div class="seg" id="view" aria-label="Group by">
      <button type="button" id="view-horizon" data-view="horizon" aria-pressed="true">By horizon</button>
      <button type="button" id="view-goal" data-view="goal" aria-pressed="false">By goal</button>
    </div>
    <select id="status" aria-label="Status">
      <option value="open">Open work</option>
      <option value="decision">Needs a decision</option>
      <option value="done">Done</option>
      <option value="all">All statuses</option>
    </select>
    <input type="search" id="search" placeholder="Search IDs, titles, tasks" aria-label="Search">
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <main id="groups" class="wrap" style="gap:28px"></main>

  <footer>
    <span id="snapshot"></span>
    <span>Priority runs from P0, critical, to P3, low.</span>
  </footer>
</div>

<script>
const DATA = [{"id": "G1", "title": "Security and privacy", "subgoals": [{"id": "G1.1", "title": "Privacy-safe request logging", "horizon": "short-term", "priority": "P0", "status": "done", "needs": [], "body": ["Why: under default uvicorn logging, the privacy-filtered `finpilot.requests` line in `finpilot/api/app.py` is never emitted, while the uvicorn access log prints full query strings such as `GET /api/transactions?q=therapy-copay&category=medical` and amounts such as `/api/debt/what-if?amount=`. Reverse proxies often log query strings too.", "Evidence: verified 2026-09-13 by running the app locally with uvicorn 0.52.4 defaults. This contradicts the logging statement in `ARCHITECTURE.md`. Fixed 2026-09-14: `tests/test_request_logging.py` starts the container command and plain Uvicorn as real processes and finds one request line without query strings, bodies or amounts.", "Done when: a production-configured deployment writes one privacy-safe line per request, and no query string, body or amount appears in application, server or proxy logs."], "tasks": [{"id": "G1.1.1", "title": "Configure the `finpilot` logger at startup so the request line is emitted under uvicorn. (done 2026-09-14: configure_request_logging in finpilot/api/request_logging.py; tests/test_request_logging.py finds the line under the container command and plain Uvicorn)", "done": true}, {"id": "G1.1.2", "title": "Keep query strings out of server logs: run uvicorn with `--no-access-log` in the `Dockerfile`, or install an access-log filter that drops query strings. (done 2026-09-14: the Dockerfile adds --no-access-log, and DropQueryStrings strips query strings when the access log is on; both checked by tests/test_request_logging.py)", "done": true}, {"id": "G1.1.3", "title": "Move amount-bearing reads (`/api/debt/what-if`, `/api/tax/net-benefit`, mortgage scenarios) to request bodies, or document a proxy log format without query strings. (done 2026-09-14: POST JSON bodies replace GET query strings for the six calculator reads and for transaction and document search; DEPLOYMENT.md Request logs shows an nginx format without query strings; a schema test allowlists query parameters)", "done": true}, {"id": "G1.1.4", "title": "Add a regression test that captures logs for a request with a sensitive query string and asserts nothing sensitive is written. (done 2026-09-14: tests/test_request_logging.py has 5 tests; two start real Uvicorn processes and send a search term and an amount)", "done": true}, {"id": "G1.1.5", "title": "Update the logging statement in `ARCHITECTURE.md` once behaviour matches. (done 2026-09-14: the ARCHITECTURE.md operations paragraph describes the request line, request bodies and both server commands)", "done": true}]}, {"id": "G1.2", "title": "Correct client addresses behind a proxy", "horizon": "short-term", "priority": "P0", "status": "doing", "needs": [], "body": ["Why: uvicorn trusts `X-Forwarded-For` only from `127.0.0.1` unless `FORWARDED_ALLOW_IPS` is set, and neither the `Dockerfile` nor `compose.yaml` sets it. Behind a proxy every user shares one address, so the IP-keyed sign-up limit (8 per 5 minutes) and sign-in limit (30 per 5 minutes) apply to all users together.", "Evidence: reproduced on 2026-09-20 with an nginx container in front of the app (`scripts/verify_proxy_client_addresses.py`, `validation/proxy-client-addresses.json`): with the proxy untrusted, 9 users from 9 addresses shared one throttle key and the ninth sign-up got 429; with it trusted, all 9 succeeded while 9 sign-ups from one address were still throttled at the ninth. A container's address depends on the runtime, so Docker Desktop for Windows arrived from `127.0.0.1`, which the uvicorn default already trusts, while a Linux bridge network would not.", "Done when: behind the production ingress, throttles key on the real client address, and forwarding headers from untrusted peers are ignored."], "tasks": [{"id": "G1.2.1", "title": "Reproduce the shared-address lockout behind a local reverse proxy container. (done 2026-09-20: `scripts/verify_proxy_client_addresses.py` with an `nginx:alpine` container; evidence in `validation/proxy-client-addresses.json`)", "done": true}, {"id": "G1.2.2", "title": "Set `FORWARDED_ALLOW_IPS` to the ingress address in the `Dockerfile`, `compose.yaml` and `DEPLOYMENT.md`. (done 2026-09-20: documented default in the `Dockerfile`, pass-through in `compose.yaml`, `.env.example` and `docs/configuration.md`, plus a \"Reverse proxy and client addresses\" section in `DEPLOYMENT.md`; the app also warns in production while only loopback is trusted)", "done": true}, {"id": "G1.2.3", "title": "Add a test that throttle keys use the forwarded address only for trusted peers. (done 2026-09-20: `tests/test_proxy_client_addresses.py` starts real Uvicorn processes; a spoofed address from an untrusted peer buys no extra sign-ups)", "done": true}, {"id": "G1.2.4", "title": "Confirm on the hosted ingress that throttles key on the real client address, after `G4.1`.", "done": false}]}, {"id": "G1.3", "title": "Strict Content-Security-Policy", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": [], "body": ["Why: the current policy only sets `frame-ancestors`, `base-uri` and `object-src`, so it does not restrict scripts.", "Evidence: checked `finpilot/api/app.py` and `finpilot/web/` on 2026-09-13. The frontend has no inline scripts or inline event handlers. External origins are the Plaid CDN and Google Fonts, and `core.js` and `pages.js` contain inline `style=` attributes.", "Done when: a strict policy is enforced in production with no violations across the main journeys."], "tasks": [{"id": "G1.3.1", "title": "Add `default-src 'self'` with explicit script, style, font, connect and frame sources for Plaid and Google Fonts.", "done": false}, {"id": "G1.3.2", "title": "Replace inline `style=` attributes with CSS classes.", "done": false}, {"id": "G1.3.3", "title": "Ship as `Content-Security-Policy-Report-Only` first, then enforce.", "done": false}, {"id": "G1.3.4", "title": "Consider self-hosting fonts so no third party receives user IP addresses.", "done": false}]}, {"id": "G1.4", "title": "Keep personal data out of external model calls", "horizon": "short-term", "priority": "P1", "status": "todo", "needs": ["G7.2"], "body": ["Adapted from: \"zero-knowledge architecture and PII redaction\". Full zero-knowledge is not possible because the server must read financial data to calculate. The adapted goal is data minimization for anything sent to a model provider or tracing service.", "Why: if the production model is a third-party API, prompts can carry names, institutions, account nicknames, amounts and document text.", "Evidence: `finpilot/ai/input_safety.py` rejects credential-like input (passwords, API keys, tokens, private keys) before prompts and storage. Nothing masks account numbers, card numbers or SSNs. LangSmith tracing is opt-in through `LANGCHAIN_TRACING_V2` in `finpilot/ai/graph.py` and would send traces to a third party. Checked 2026-09-13.", "Done when: prompts and traces sent outside the deployment contain only the fields they need, identifiers are masked, and each provider's data terms are documented."], "tasks": [{"id": "G1.4.1", "title": "Inventory every prompt builder (planner context, explanations, knowledge extraction) and the personal fields each sends.", "done": false}, {"id": "G1.4.2", "title": "Mask account, routing and card numbers and SSN patterns before external calls, with tests.", "done": false}, {"id": "G1.4.3", "title": "Prefer providers with zero-retention or no-training terms and record them in `DEPLOYMENT.md`.", "done": false}, {"id": "G1.4.4", "title": "Block LangSmith tracing in production unless redaction is in place.", "done": false}]}, {"id": "G1.5", "title": "Secrets and key management", "horizon": "short-term", "priority": "P1", "status": "todo", "needs": [], "body": ["Why: secrets come from environment variables, and rotating `FINPILOT_TOKEN_KEY` needs a controlled decrypt and re-encrypt migration that does not exist.", "Evidence: `DEPLOYMENT.md` \"Optional Plaid bank linking\".", "Done when: production secrets live in a managed secret store with access auditing, and a tested key-rotation command exists."], "tasks": [{"id": "G1.5.1", "title": "Choose the secret store for the hosting platform and document how secrets are injected.", "done": false}, {"id": "G1.5.2", "title": "Build and test a key-rotation command that re-encrypts stored Plaid and MCP credentials.", "done": false}, {"id": "G1.5.3", "title": "Add secret scanning to continuous integration.", "done": false}]}, {"id": "G1.6", "title": "Encryption posture", "horizon": "short-term", "priority": "P1", "status": "todo", "needs": [], "body": ["Adapted from: \"AES-256 at rest and TLS 1.3 in transit\". FinPilot encrypts stored provider credentials with Fernet (AES-128-CBC with HMAC-SHA256), which is sound. Database, backup and transport encryption depend on hosting choices not yet made.", "Why: encryption at rest and in transit has not been configured or verified for a hosted environment.", "Evidence: Fernet usage in `finpilot/integrations/plaid.py` and `finpilot/integrations/mcp_client.py`.", "Done when: managed PostgreSQL and backups are encrypted at rest, ingress allows only TLS 1.2 or newer with 1.3 preferred, and the posture is documented."], "tasks": [{"id": "G1.6.1", "title": "Confirm encryption at rest for the chosen managed PostgreSQL and its backups.", "done": false}, {"id": "G1.6.2", "title": "Configure the ingress TLS policy and verify it with an external TLS scanner.", "done": false}, {"id": "G1.6.3", "title": "Move stored credentials to AES-256-GCM only if a chosen compliance framework requires it.", "done": false}]}, {"id": "G1.7", "title": "Independent security review", "horizon": "short-term", "priority": "P1", "status": "todo", "needs": ["G4.1"], "body": ["Why: FinPilot will hold bank tokens and financial history, and no external review has taken place.", "Done when: a penetration test of the hosted staging environment is complete and every high-severity finding is fixed."], "tasks": [{"id": "G1.7.1", "title": "Run an automated web scan (for example OWASP ZAP) against staging.", "done": false}, {"id": "G1.7.2", "title": "Commission a third-party penetration test before real users.", "done": false}, {"id": "G1.7.3", "title": "Track findings as roadmap tasks.", "done": false}]}, {"id": "G1.8", "title": "Database row-level security", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Adapted from: \"row-level security in PostgreSQL\". Tenant isolation already exists in application code, so this is defense in depth rather than a migration.", "Why: a future query that forgets its household filter would currently rely on tests alone to be caught.", "Evidence: the household is derived from the session on every route, and cross-tenant denial tests pass (`END_TO_END_VALIDATION.md`).", "Done when: PostgreSQL policies block cross-household reads even when an application query omits its filter."], "tasks": [{"id": "G1.8.1", "title": "Design a per-transaction household setting compatible with the session-per-operation runtime.", "done": false}, {"id": "G1.8.2", "title": "Add policies through an Alembic migration and prove them with a test that omits a filter.", "done": false}]}]}, {"id": "G2", "title": "Identity and account lifecycle", "subgoals": [{"id": "G2.1", "title": "Transactional email", "horizon": "short-term", "priority": "P0", "status": "decision", "needs": [], "body": ["Why: the application cannot send email, and verification, password reset, invitations and reminders all depend on it.", "Decision needed: which email provider and sending domain to use.", "Done when: templated email is sent through the chosen provider with bounce handling, and tests use a fake transport."], "tasks": [{"id": "G2.1.1", "title": "Choose the provider and sending domain with equirements.txt` and `Dockerfile` (checked 2026-09-13).", "Done when: the image installs from a hashed lock file, development tools are separate, and the base image is pinned."], "tasks": [{"id": "G6.3.1", "title": "Split runtime and development requirements.", "done": false}, {"id": "G6.3.2", "title": "Generate a hashed lock file and install from it in the `Dockerfile`.", "done": false}, {"id": "G6.3.3", "title": "Pin the Python base image by digest.", "done": false}]}, {"id": "G6.4", "title": "Dependency and image scanning", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G5.1"], "body": ["Why: nobody is told when a dependency or the base image has a known vulnerability.", "Done when: continuous integration reports vulnerable packages and image CVEs, and dependency updates arrive as pull requests."], "tasks": [{"id": "G6.4.1", "title": "Add a Python dependency audit and a container image scanner to continuous integration.", "done": false}, {"id": "G6.4.2", "title": "Enable automated dependency update pull requests.", "done": false}]}, {"id": "G6.5", "title": "Line-ending policy", "horizon": "mid-term", "priority": "P3", "status": "todo", "needs": [], "body": ["Why: Git warns about LF and CRLF conversions on several files.", "Done when: `.gitattributes` defines line endings without a whole-repository reformat."], "tasks": [{"id": "G6.5.1", "title": "Add `.gitattributes` and renormalize files only when they are next edited.", "done": false}]}]}, {"id": "G7", "title": "AI assistant", "subgoals": [{"id": "G7.1", "title": "Grounded calculation architecture", "horizon": "short-term", "priority": "P0", "status": "done", "needs": [], "body": ["From: \"deterministic financial engine versus generative guardrails\", \"code execution and rule engine\" and \"output validation and guardrails\".", "Why: language models make arithmetic and precision mistakes, so numbers must come from code.", "Evidence: present in commit `76f95b1`; see `ARCHITECTURE.md` \"AI erms for each.", "done": false}, {"id": "G7.2.3", "title": "Decide with the user and document the `FINPILOT_LLM_*` settings in `DEPLOYMENT.md`.", "done": false}, {"id": "G7.2.4", "title": "Include figure-token wording acceptance from `scripts/measure_figure_tokens.py` in the host comparison.", "done": false}]}, {"id": "G7.3", "title": "Close interpretation gaps", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G7.2"], "body": ["Why: 25 of 140 cases time out, and `get_mortgage_scenarios`, `compare_card_vs_bank_for_bill` and `update_goal` never had an accepted interpretation.", "Evidence: `END_TO_END_VALIDATION.md` \"Remaining interpretation limits\".", "Done when: every capability has an accepted interpretation on the production model, and paraphrase coverage meets an agreed target."], "tasks": [{"id": "G7.3.1", "title": "Profile planner prompt size for the failing capabilities.", "done": false}, {"id": "G7.3.2", "title": "Shrink their schemas or context and re-run the matrix.", "done": false}, {"id": "G7.3.3", "title": "Check how out-of-scope requests are answered and add tests for them. (done 2026-09-15: the topic gate in `finpilot/ai/guardrails.py` gives unrelated requests a fixed reply with no model call; `tests/test_answer_guards.py` covers every manifest and routed question, unrelated prompts and acknowledgements)", "done": true}]}, {"id": "G7.4", "title": "Provider fallback chain", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G7.2"], "body": ["From: \"automated fallbacks across model providers during outages or rate limits\".", "Why: when the single configured model fails, answers drop straight to calculator wording.", "Evidence: calculator fallback already exists (`ARCHITECTURE.md`).", "Done when: a secondary provider takes over on outage or rate limit before calculator mode, and each hop is visible in metrics."], "tasks": [{"id": "G7.4.1", "title": "Support an ordered list of model endpoints with health-based failover.", "done": false}, {"id": "G7.4.2", "title": "Test failover with `finpilot/ai/mock_server.py`.", "done": false}]}, {"id": "G7.5", "title": "Usage quotas and cost tracking", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G7.2"], "body": ["From: \"usage quotas and user-level throttling\".", "Why: a hosted model costs money per request, and nothing limits or measures spending per household.", "Evidence: per-user request throttling exists (`/api/ask` allows 30 per minute), and inference has a per-process admission limit.", "Done when: token use and cost are recorded per household, quotas are enforced, and cost dashboards exist."], "tasks": [{"id": "G7.5.1", "title": "Record provider-reported tokens per request without prompt text.", "done": false}, {"id": "G7.5.2", "title": "Enforce per-household quotas with clear messages in the UI.", "done": false}]}, {"id": "G7.6", "title": "Privacy-safe AI tracing", "horizon": "mid-term", "priority": "P2", "status": "todo", "needs": [], "body": ["From: \"LLM tracing with LangSmith, Arize Phoenix or Helicone\".", "Why: prompts contain financial data, so third-party tracing must be redacted or self-hosted.", "Evidence: opt-in LangSmith tracing exists in `finpilot/ai/graph.py` without redaction.", "Done when: latency, token use, fallback reasons and prompt versions are traced with personal data removed, and tracing is off unless configured."], "tasks": [{"id": "G7.6.1", "title": "Choose self-hosted or redacted tracing, following G1.4.", "done": false}, {"id": "G7.6.2", "title": "Version prompts so traces and evaluations point to a prompt revision.", "done": false}]}, {"id": "G7.7", "title": "Evidence-linked insights", "horizon": "mid-term", "priority": "P2", "status": "done", "needs": [], "body": ["From: \"confidence and citation scoring back to exact transactions\".", "Why: spending and cash-flow insights did not link to the records behind them, and answers had no stated confidence.", "Evidence: `finpilot/ai/evidence.py`; `tests/test_evidence_links.py`; the capability loop in `tests/test_capability_workflows.py` validates every answer's evidence fields; `tests/assistant_frontend.mjs` covers the links. Document answers keep their clickable excerpt citations. Coverage, tax and product-boundary answers link no records.", "Done when: every spending or balance insight links to its supporting records."], "tasks": [{"id": "G7.7.1", "title": "Attach transaction IDs to spending and recurring-activity results. (done 2026-09-15: spending allowance and forecast results list the bills, income sources and pending transactions in their window, transaction searches list each transaction and recurring activity lists its rules; `tests/test_evidence_links.py`)", "done": true}, {"id": "G7.7.2", "title": "Render them as clickable evidence in the assistant. (done 2026-09-15: \"Record sources\" links in `finpilot/web/assistant.js`; `tests/assistant_frontend.mjs`)", "done": true}, {"id": "G7.7.3", "title": "Score evidence confidence with a documented rubric and show the reasons. (done 2026-09-15: `evidence_confidence` in `finpilot/ai/evidence.py`; `docs/calculation-methods.md` \"Evidence confidence\")", "done": true}, {"id": "G7.7.4", "title": "Validate record links, figure sources and confidence against a JSON Schema before an answer is saved. (done 2026-09-15: `EVIDENCE_SCHEMA` and `attach_evidence`; `tests/test_evidence_links.py`)", "done": true}]}, {"id": "G7.8", "title": "Progress updates during long answers", "horizon": "long-term", "priority": "P3", "status": "todo", "needs": [], "body": ["Adapted from: \"streaming token delivery with server-sent events or WebSockets\". FinPilot deliberately never shows an unverified token stream as a financial answer, so only progress stages are streamed.", "Why: answers can take several seconds with no sign of progress.", "Done when: the assistant shows live stages such as planning, calculating and verifying, and final numbers still appear only after verification."], "tasks": [{"id": "G7.8.1", "title": "Stream stage events for `/api/ask` over server-sent events.", "done": false}]}, {"id": "G7.9", "title": "Figure tokens and answer checks", "horizon": "short-term", "priority": "P1", "status": "done", "needs": [], "body": ["From: \"separation of math and language\", \"LLM guardrails and grounding\" and \"output validation and guardrails\", requested again on 2026-09-15.", "Adapted from: NeMo Guardrails or Instructor. Native checks run on every answer path without a new dependency; see \"Considered and not adopted\".", "Why: numeric grounding accepted any supported figure in any sentence, so model wording could still attach a real figure to the wrong claim, add investment or product advice, or answer unrelated prompts.", "Evidence: `finpilot/ai/facts.py`; `advice_claim_error` and `in_domain` in `finpilot/ai/guardrails.py`; `tests/test_fact_tokens.py`, `tests/test_answer_guards.py` and the mock-model tests in `tests/test_ai.py`; local-model measurements in `validation/figure-tokens-*.json`, summarized in `AI_VALIDATION.md`.", "Done when: model wording cannot type a figure, added advice and unrelated requests fall back or get a fixed reply, and token wording is measured on a local model."], "tasks": [{"id": "G7.9.1", "title": "Replace every figure in the reference answer with a token and insert exact figures on the server. (done 2026-09-15: `finpilot/ai/facts.py`; every manifest and routed reference answer round-trips in `tests/test_fact_tokens.py`)", "done": true}, {"id": "G7.9.2", "title": "Reject model wording that adds investment, product, eligibility or legal advice. (done 2026-09-15: `advice_claim_error`; `tests/test_answer_guards.py` and the `advise` mock mode in `tests/test_fact_tokens.py`)", "done": true}, {"id": "G7.9.3", "title": "Give unrelated requests a fixed reply without a model call, and unrecognized requests fixed guidance. (done 2026-09-15: `tests/test_answer_guards.py` and `tests/test_fact_tokens.py`)", "done": true}, {"id": "G7.9.4", "title": "Measure token wording on local models. (done 2026-09-15: `scripts/measure_figure_tokens.py`; `validation/figure-tokens-*.json`; `AI_VALIDATION.md`)", "done": true}]}, {"id": "G7.10", "title": "Verified wording and plan cache", "horizon": "mid-term", "priority": "P2", "status": "done", "needs": [], "body": ["Adapted from: \"semantic caching of repeated queries with Redis or a vector cache\". Answers depend on live household data, so only verified wording without figures and validated plans are cached, matched by exact prompt digest per household.", "Why: a repeated question paid for another model call even when the same verified wording applied.", "Evidence: `finpilot/ai/wording_cache.py`; the planner cache in `finpilot/ai/workflows.py`; `tests/test_wording_cache.py`; repeat questions in `validation/figure-tokens-*.json`.", "Done when: a repeated question reuses verified wording with current figures and no model call, and rejected wording is never cached."], "tasks": [{"id": "G7.10.1", "title": "Cache accepted token wording per household, model and prompt version. (done 2026-09-15: `tests/test_wording_cache.py` reuses wording after a balance change and never caches rejected wording)", "done": true}, {"id": "G7.10.2", "title": "Cache schema-valid workflow plans and validate them again on every use. (done 2026-09-15: `plan_with_model` in `finpilot/ai/workflows.py`; the repeated-plan test in `tests/test_wording_cache.py`)", "done": true}]}]}, {"id": "G8", "title": "Bank connectivity and data ingestion", "subgoals": [{"id": "G8.1", "title": "Plaid sandbox end to end", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G4.1"], "body": ["Why: the Plaid adapter has now passed against Plaid Sandbox locally, but bank linking should stay disabled for real users until the same journey works in hosted staging.", "Evidence: `ARCHITECTURE.md` \"Bank connection and synchronization\". `scripts/verify_plaid_sandbox.py` passed against Plaid Sandbox on 2026-09-14 local time and wrote `validation/plaid-sandbox-e2e.json` with link token, exchange, two syncs, transaction reads and disconnect all successful.", "Done when: link, exchange, sync and disconnect work against Plaid Sandbox in staging, with evidence under `validation/`."], "tasks": [{"id": "G8.1.1", "title": "Configure sandbox credentials in a non-production environment. (done 2026-09-14: `.local/plaid-sandbox.env`, git-ignored, contains non-empty Sandbox values; values were not committed or printed)", "done": true}, {"id": "G8.1.2", "title": "Run the link, sync and disconnect journeys and record the results. (done 2026-09-14: `scripts/verify_plaid_sandbox.py` passed with evidence in `validation/plaid-sandbox-e2e.json`)", "done": true}, {"id": "G8.1.3", "title": "Automate the Sandbox journey with evidence output. (done 2026-09-14: scripts/verify_plaid_sandbox.py, tested against a mocked Plaid in tests/test_plaid_sandbox_check.py)", "done": true}, {"id": "G8.1.4", "title": "Repeat the Sandbox journey against hosted staging after `G4.1` exists.", "done": false}, {"id": "G8.1.5", "title": "Link and sync a Sandbox institution through the browser with the real Plaid Link SDK. (done 2026-09-19: owner linked Tartan Bank with `user_good` in Chrome on a local server; `POST /api/bank/exchange` 200, 8 accounts imported, `POST /api/bank/sync/...` 200 with 365 transactions; disconnect not run)", "done": true}, {"id": "G8.1.6", "title": "Log the Plaid `error_code` and endpoint server-side when a provider call fails, without keys or tokens. On 2026-09-19 a production `INVALID_API_KEYS` surfaced only as \"The bank connection could not be updated\" and a bare 502, and needed a direct API call to diagnose. (done 2026-09-19: `PlaidClient._post` logs environment, endpoint, status, error type, code and request ID; `tests/test_plaid_sandbox_check.py`; a live production call logged `error_code=INVALID_API_KEYS`)", "done": true}, {"id": "G8.1.7", "title": "Stop `scripts/verify_plaid_sandbox.py` importing `finpilot.api.app` at module level: importing it builds a `Database` from `FINPILOT_DATABASE_URL` as it is at that moment, so a caller that imports the script before setting that variable silently uses `.local/finpilot.db`. (done 2026-09-19: `create_app` is imported inside `run`; a subprocess test in `tests/test_plaid_sandbox_check.py` checks the import leaves `finpilot.api.app` unloaded)", "done": true}]}, {"id": "G8.2", "title": "Plaid production access", "horizon": "mid-term", "priority": "P1", "status": "decision", "needs": ["G8.1"], "body": ["Why: production bank data needs approved Plaid access.", "Decision needed: the Plaid plan and pricing, and whether to apply for production access.", "Done when: production credentials are issued and stored in the secret store.", "Evidence: on 2026-09-19 both sets of keys the owner saved, including those from a new Plaid account, were accepted by `sandbox.plaid.com` and rejected by `production.plaid.com` with `INVALID_API_KEYS`, so no production secret is available yet."], "tasks": [{"id": "G8.2.1", "title": "Apply for production access and complete the required reviews.", "done": false}, {"id": "G8.2.2", "title": "Register an HTTPS redirect URI before testing OAuth institutions in production: `create_link_token` only sends `redirect_uri` for an `https://` origin, so OAuth banks cannot complete from `http://127.0.0.1`.", "done": false}]}, {"id": "G8.3", "title": "Webhooks", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G8.1"], "body": ["From: \"idempotent webhook handlers for transaction updates and disconnects\".", "Why: data only refreshes when a user presses Sync.", "Done when: verified, idempotent handlers process transaction updates, item errors and consent expiry."], "tasks": [{"id": "G8.3.1", "title": "Verify webhook signatures and store event IDs for idempotency.", "done": false}, {"id": "G8.3.2", "title": "Queue sync jobs from webhooks once G9.1 exists.", "done": false}]}, {"id": "G8.4", "title": "Reconnect flows", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G8.1"], "body": ["Why: Plaid update mode for expired or broken connections is not implemented.", "Done when: users are prompted to reconnect and can repair a connection without creating duplicate accounts."], "tasks": [{"id": "G8.4.1", "title": "Implement update mode and a reconnect prompt.", "done": false}]}, {"id": "G8.5", "title": "More account types", "horizon": "mid-term", "priority": "P2", "status": "doing", "needs": ["G8.1"], "body": ["From: \"liability tracking\" and investment data from aggregators.", "Why: only checking, savings and money-market accounts could be linked.", "Evidence: until 2026-09-14 `finpilot/integrations/plaid.py` requested Transactions for depository accounts only. Cards and loans now link with Liabilities terms, verified against a mocked Plaid and a Plaid Sandbox run on 2026-09-14 local time.", "Done when: credit cards, loans and investment holdings can be linked and feed the debt, card and net-worth features."], "tasks": [{"id": "G8.5.1", "title": "Link credit cards and loans with liabilities data. (done 2026-09-14: apply_liabilities in finpilot/integrations/plaid.py; tests/test_bank_aggregation.py against a mocked Plaid)", "done": true}, {"id": "G8.5.2", "title": "Link investment holdings.", "done": false}]}, {"id": "G8.6", "title": "Scheduled sync", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G8.1", "G9.1"], "body": ["Why: balances go stale unless someone syncs by hand.", "Done when: linked accounts sync on a schedule and after webhooks without user action."], "tasks": [{"id": "G8.6.1", "title": "Add a scheduled sync job with backoff and per-connection error states.", "done": false}]}, {"id": "G8.7", "title": "Transaction enrichment", "horizon": "mid-term", "priority": "P2", "status": "doing", "needs": [], "body": ["From: \"merchant cleaning, recurring erms.", "done": false}, {"id": "G8.8.2", "title": "Add an OCR job with a review queue for pages that fail.", "done": false}]}, {"id": "G8.9", "title": "Additional aggregators", "horizon": "long-term", "priority": "P3", "status": "decision", "needs": ["G8.2"], "body": ["From: \"MX, Teller or Yodlee\".", "Why: one aggregator may not cover every institution users have.", "Evidence: on 2026-09-14 the owner asked for aggregator APIs such as Plaid, MX or Yodlee. Only Plaid is implemented; the apply functions in `finpilot/integrations/plaid.py` and the table in `finpilot/integrations/categories.py` are the seams for another provider.", "Decision needed: whether measured coverage gaps justify a second aggregator.", "Done when: the decision is recorded with coverage data."], "tasks": [{"id": "G8.9.1", "title": "Measure institution coverage gaps from real users before deciding.", "done": false}]}]}, {"id": "G9", "title": "Background jobs and notifications", "subgoals": [{"id": "G9.1", "title": "Job runner", "horizon": "mid-term", "priority": "P1", "status": "decision", "needs": [], "body": ["From: \"distributed task queues such as Celery, BullMQ or SQS\".", "Why: the only background thread checks model health, so nothing runs unless a user acts.", "Evidence: `finpilot/runtime.py` starts one model-health thread; no scheduler exists (checked 2026-09-13).", "Decision needed: a PostgreSQL-backed queue with no new infrastructure, or Celery or RQ with Redis. Recommendation: start with PostgreSQL, which is already required.", "Done when: jobs run in a separate worker with retries, idempotency keys, schedules and visible status."], "tasks": [{"id": "G9.1.1", "title": "Choose the queue technology with the user.", "done": false}, {"id": "G9.1.2", "title": "Add a worker entry point, a scheduler and job metrics.", "done": false}]}, {"id": "G9.2", "title": "Bill and balance reminders", "horizon": "mid-term", "priority": "P1", "status": "todo", "needs": ["G9.1", "G2.1"], "body": ["Why: there are no reminders or notifications of any kind.", "Done when: users receive reminders for upcoming bills, low projected balances and failed syncs, driven by the existing forecast engines."], "tasks": [{"id": "G9.2.1", "title": "Build reminder jobs from bill schedules and forecast calculations.", "done": false}, {"id": "G9.2.2", "title": "Add email templates and an in-app notification list.", "done": false}]}, {"id": "G9.3", "title": "Notification preferences", "horizon": "mid-term", "priority": "P2", "status": "todo", "needs": ["G9.2"], "body": ["Why: reminders without controls quickly become noise.", "Done when: users choose channels, frequency and quiet hours per notification type."], "tasks": [{"id": "G9.3.1", "title": "Add a preferences model and settings UI.", "done": false}, {"id": "G9.3.2", "title": "Add web push, then mobile push with G11.2.", "done": false}]}, {"id": "G9.4", "title": "Asynchronous document processing", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": ["G9.1"], "body": ["From: \"asynchronous indexing\".", "Why: document extraction runs inside the upload request through a subprocess with a 15-second timeout.", "Evidence: `finpilot/services/documents.py` (checked 2026-09-13).", "Done when: uploads return immediately, processing status is visible, and failures can be retried."], "tasks": [{"id": "G9.4.1", "title": "Move extraction and indexing into jobs with status updates.", "done": false}]}]}, {"id": "G10", "title": "Data platform and scale", "subgoals": [{"id": "G10.1", "title": "Separate transaction history from the household snapshot", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Why: the household aggregate is decoded and re-encoded on writes, so write cost grows with history.", "Evidence: `ARCHITECTURE.md` \"Repeatable latency evidence\".", "Done when: history lives in its own tables, write cost no longer grows with history, and the benchmark shows it."], "tasks": [{"id": "G10.1.1", "title": "Design the split, including migration and consistency rules.", "done": false}, {"id": "G10.1.2", "title": "Run `scripts/benchmark.py` before and after.", "done": false}]}, {"id": "G10.2", "title": "Semantic and hybrid document search", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Adapted from: \"persistent vector storage\" and \"hybrid BM25 plus semantic search\". FinPilot has no in-memory vector store to migrate away from; retrieval is lexical today and production already runs on PostgreSQL.", "Why: lexical search misses paraphrases, and scanned or long documents make it worse.", "Done when: retrieval combines lexical and embedding search in PostgreSQL with pgvector, scoped to the household, and quality is measured with `scripts/evaluate_knowledge.py`."], "tasks": [{"id": "G10.2.1", "title": "Add pgvector embeddings with household-scoped indexes.", "done": false}, {"id": "G10.2.2", "title": "Combine lexical and semantic ranking and compare them on the knowledge evaluation.", "done": false}, {"id": "G10.2.3", "title": "Keep embedding generation within the privacy rules of G1.4.", "done": false}]}, {"id": "G10.3", "title": "Multi-currency", "horizon": "long-term", "priority": "P3", "status": "todo", "needs": [], "body": ["Why: totals skip accounts whose currency differs from the household base currency, and bank linking is US only.", "Evidence: totals in `finpilot/models.py` and `country_codes` in `finpilot/integrations/plaid.py`.", "Done when: non-base-currency accounts are converted with dated exchange rates and clearly labelled."], "tasks": [{"id": "G10.3.1", "title": "Add an exchange-rate source and convert balances in totals.", "done": false}]}, {"id": "G10.4", "title": "Double-entry ledger evaluation", "horizon": "long-term", "priority": "P3", "status": "decision", "needs": [], "body": ["From: \"a double-entry ledger such as Ledger or Beancount\".", "Why: double-entry accounting can catch balance errors, but FinPilot's `finpilot/engine/ledger.py` is a dated cash-flow forecast, so adopting it would be a redesign.", "Decision needed: whether double-entry integrity justifies a data-model migration.", "Done when: a short design comparison is written and the decision is recorded."], "tasks": [{"id": "G10.4.1", "title": "Write the comparison against the current engines and snapshot model.", "done": false}]}]}, {"id": "G11", "title": "Product experience", "subgoals": [{"id": "G11.1", "title": "Category budgets", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Why: a spending allowance exists, but there are no per-category budgets or overspend tracking.", "Done when: users set monthly category budgets, see progress, and the assistant explains overspending with evidence."], "tasks": [{"id": "G11.1.1", "title": "Add the budget model, engine calculations and API.", "done": false}, {"id": "G11.1.2", "title": "Add budget pages and assistant capabilities.", "done": false}]}, {"id": "G11.2", "title": "Installable mobile experience", "horizon": "long-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Why: FinPilot is a responsive website with no web app manifest, service worker or native app.", "Done when: users can install FinPilot on a phone, and a native app decision is recorded."], "tasks": [{"id": "G11.2.1", "title": "Add a manifest and a service worker that never caches financial API responses.", "done": false}, {"id": "G11.2.2", "title": "Decide on native apps after measuring mobile use.", "done": false}]}, {"id": "G11.3", "title": "Accessibility", "horizon": "mid-term", "priority": "P2", "status": "todo", "needs": [], "body": ["Why: the UI uses ARIA roles and labels, but it has never been audited.", "Done when: the main journeys meet WCAG 2.2 AA in an audit, and automated checks run with G5.5."], "tasks": [{"id": "G11.3.1", "title": "Run an accessibility audit and fix the findings.", "done": false}]}, {"id": "G11.4", "title": "A 6-09-14).", "Decision needed: which license to publish under, or whether the repository should be private instead.", "Done when: the chosen license is committed, or the repository visibility is changed, and the decision is recorded in `HANDOFF.md` section 7."], "tasks": [{"id": "G13.2.1", "title": "Decide the license or visibility with the owner and apply it.", "done": false}]}, {"id": "G13.3", "title": "Security policy", "horizon": "short-term", "priority": "P1", "status": "decision", "needs": [], "body": ["Why: a public repository needs a private way to report vulnerabilities.", "Evidence: `SECURITY.md` was drafted on 2026-09-14 with private reporting through GitHub, scope and supported versions. Private vulnerability reporting is not enabled yet, and no response time is promised.", "Decision needed: whether to enable GitHub private vulnerability reporting, and what response time `SECURITY.md` should promise.", "Done when: `SECURITY.md` explains how to report a vulnerability privately, what is in scope and the expected response time."], "tasks": [{"id": "G13.3.1", "title": "Write `SECURITY.md` and enable private vulnerability reporting on GitHub.", "done": false}]}, {"id": "G13.4", "title": "Complete configuration reference", "horizon": "short-term", "priority": "P2", "status": "done", "needs": [], "body": ["Why: some settings that change behaviour or send data elsewhere are not documented.", "Evidence: `FINPILOT_LLM_TEMPERATURE` (`finpilot/ai/llm.py`) and the LangSmith variables `LANGCHAIN_TRACING_V2`, `LANGCHAIN_API_KEY` and `LANGCHAIN_PROJECT` (`finpilot/ai/graph.py`) appear in no document. Every other setting is in `.env.example`, `DEPLOYMENT.md` or `MCP.md` (checked 2026-09-14).", "Done when: one table lists every setting with its default and effect, including a privacy warning for tracing."], "tasks": [{"id": "G13.4.1", "title": "Document the missing settings in `.env.example` and `DEPLOYMENT.md`. (done 2026-09-14: docs/configuration.md, .env.example and a link from DEPLOYMENT.md)", "done": true}, {"id": "G13.4.2", "title": "Add a test that fails when code reads a setting that no document mentions. (done 2026-09-14: tests/test_docs.py test_every_setting_is_documented)", "done": true}]}, {"id": "G13.5", "title": "Product specification traceability", "horizon": "short-term", "priority": "P2", "status": "decision", "needs": [], "body": ["Why: code cites requirement IDs that nobody can look up from this repository.", "Evidence: modules cite spec sections and requirement IDs such as `HN01`, `TR01`, `PL04` and `IN01`, but no specification document is tracked (checked 2026-09-14).", "Decision needed: whether the product specification can be committed to this public repository, or only an index of requirement IDs.", "Done when: every requirement ID cited in code resolves to a committed description."], "tasks": [{"id": "G13.5.1", "title": "Decide with the owner, then commit the specification or a requirement index.", "done": false}]}, {"id": "G13.6", "title": "API reference", "horizon": "mid-term", "priority": "P1", "status": "done", "needs": [], "body": ["Why: the automatic API pages list endpoints without explaining them.", "Evidence: FastAPI serves `/docs` and `/redoc`, but none of the route handlers has a docstring, summary or description (checked 2026-09-14).", "Done when: every endpoint has a summary, a description and documented errors, and a committed OpenAPI file is checked for drift."], "tasks": [{"id": "G13.6.1", "title": "Add summaries and descriptions to every route in `finpilot/api/`. (done 2026-09-14: finpilot/api/route_docs.py covers all 84 operations)", "done": true}, {"id": "G13.6.2", "title": "Export `openapi.json` into `docs/` and add a test that fails when it is stale. (done 2026-09-14: docs/api/openapi.json and tests/test_docs.py)", "done": true}]}, {"id": "G13.7", "title": "Calculation methods reference", "horizon": "mid-term", "priority": "P1", "status": "done", "needs": [], "body": ["Why: FinPilot gives ed multi-line table definitions).", "Done when: a generated reference describes every table, its ownership columns and the household snapshot structure."], "tasks": [{"id": "G13.9.1", "title": "Generate a schema reference from the SQLAlchemy metadata and check it in tests. (done 2026-09-14: docs/data-model.md)", "done": true}]}, {"id": "G13.10", "title": "End-user help", "horizon": "mid-term", "priority": "P2", "status": "doing", "needs": [], "body": ["Why: people using FinPilot have no help pages for its workflows.", "Evidence: `docs/user-guide.md` covers the main workflows as of 2026-09-14; the app does not link to it yet.", "Done when: help pages cover sign-up, CSV import, paycheck planning, reviewing AI changes and bank linking, and the app links to them."], "tasks": [{"id": "G13.10.1", "title": "Write help pages for the main workflows and link them from the app.", "done": false}]}, {"id": "G13.11", "title": "Contributor guide and changelog", "horizon": "mid-term", "priority": "P3", "status": "doing", "needs": [], "body": ["Why: new contributors have no single guide, and releases have no notes.", "Evidence: no `CONTRIBUTING.md`, `CHANGELOG.md`, issue templates or `CODEOWNERS` exist (checked 2026-09-14).", "Done when: `CONTRIBUTING.md` points to setup, tests and `AGENTS.md`, and `CHANGELOG.md` records each release."], "tasks": [{"id": "G13.11.1", "title": "Write `CONTRIBUTING.md` and start `CHANGELOG.md`. (done 2026-09-14: CONTRIBUTING.md and CHANGELOG.md)", "done": true}, {"id": "G13.11.2", "title": "Add issue templates and `CODEOWNERS` if outside contributions are expected.", "done": false}]}, {"id": "G13.12", "title": "Frontend architecture notes", "horizon": "long-term", "priority": "P3", "status": "done", "needs": [], "body": ["Why: `ARCHITECTURE.md` covers only asset versioning for the browser code.", "Done when: a short guide maps the modules in `finpilot/web/`, the state flow and the rendering and escaping conventions."], "tasks": [{"id": "G13.12.1", "title": "Write the frontend module map and conventions. (done 2026-09-14: docs/frontend.md)", "done": true}]}]}];
const META = {"source": "ROADMAP.md"};
const HORIZONS = [["short-term", "Short-term", "Needed before real users rely on FinPilot (launch blockers and launch hardening)"], ["mid-term", "Mid-term", "Expected in the first months after launch"], ["long-term", "Long-term", "Growth, scale and product decisions"]];
const OPEN = new Set(["todo","doing","blocked","decision"]);
const STATUS_COLOR = {done:"var(--good)",doing:"var(--info)",decision:"var(--accent)",blocked:"var(--crit)",todo:"var(--line-strong)",dropped:"var(--muted)"};
const PRIO = {P0:0,P1:1,P2:2,P3:3};
const FIELDS = ["Why","Evidence","From","Adapted from","Done when","Decision needed","Blocked by"];
const subs = [];
DATA.forEach(g => g.subgoals.forEach(s => {
  const f = {};
  s.body.forEach(line => { const k = FIELDS.find(n => line.startsWith(n + ":")); if (k) f[k] = line.slice(k.length + 1).trim(); });
  subs.push({...s, goal: g, fields: f, text: [s.id, s.title, g.title, ...s.body, ...s.tasks.map(t => t.id + " " + t.title)].join(" ").toLowerCase()});
}));
const byId = Object.fromEntries(subs.map(s => [s.id, s]));
const state = {view:"horizon", status:"open", horizon:null, q:""};
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
function rich(text) {
  const frag = document.createDocumentFragment();
  String(text).split("`").forEach((part, i) => frag.append(i % 2 ? el("code", null, part) : document.createTextNode(part)));
  return frag;
}
const order = id => id.slice(1).split(".").map(Number);
const cmpId = (a, b) => { const x = order(a), y = order(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] ?? -1) !== (y[i] ?? -1)) return (x[i] ?? -1) - (y[i] ?? -1); } return 0; };

function renderHeader() {
  const tasks = subs.flatMap(s => s.tasks), done = tasks.filter(t => t.done).length;
  const p = document.getElementById("progress");
  [[`${done}/${tasks.length}`, "tasks done"], [`${subs.filter(s => s.status === "done").length}/${subs.length}`, "sub-goals done"], [String(DATA.length), "long-term goals"], [String(subs.filter(s => s.status === "decision").length), "decisions pending"]]
    .forEach(([n, label]) => { const s = el("span"); s.append(el("b", "num", n), document.createTextNode(" " + label)); p.append(s); });
  const bands = document.getElementById("bands");
  HORIZONS.forEach(([key, name, def]) => {
    const group = subs.filter(s => s.horizon === key), open = group.filter(s => OPEN.has(s.status));
    const b = el("button", "band"); b.type = "button"; b.id = "band-" + key; b.dataset.horizon = key; b.setAttribute("aria-pressed", "false");
    b.append(el("h2", null, name), el("span", "def", def));
    const stats = el("div", "stats");
    [[open.length, "open", ""], [open.filter(s => s.priority === "P0").length, "P0", "p0"], [group.filter(s => s.status === "done").length, "done", ""]]
      .forEach(([n, label, cls]) => { const s = el("span"); s.append(el("span", "num " + cls, String(n)), document.createTextNode(label)); stats.append(s); });
    const mix = el("div", "mix"); mix.setAttribute("aria-hidden", "true");
    ["done","doing","decision","blocked","todo","dropped"].forEach(st => { const c = group.filter(s => s.status === st).length; if (c) { const seg = el("span"); seg.style.width = (100 * c / group.length) + "%"; seg.style.background = STATUS_COLOR[st]; seg.title = `${c} ${st}`; mix.append(seg); } });
    b.append(stats, mix);
    b.addEventListener("click", () => { state.horizon = state.horizon === key ? null : key; render(); });
    bands.append(b);
  });
  const list = document.getElementById("decisions");
  subs.filter(s => s.status === "decision").sort((a, b) => HORIZONS.findIndex(h => h[0] === a.horizon) - HORIZONS.findIndex(h => h[0] === b.horizon) || PRIO[a.priority] - PRIO[b.priority] || cmpId(a.id, b.id))
    .forEach(s => {
      const li = el("li"), jump = el("button", null, s.id); jump.type = "button"; jump.addEventListener("click", () => reveal(s.id));
      const q = el("span"); q.append(el("strong", null, s.title + ". "), rich(s.fields["Decision needed"] || ""));
      li.append(jump, q, el("span", "tag", `${s.horizon} · ${s.priority}`)); list.append(li);
    });
  document.getElementById("snapshot").textContent = `Source: ${META.source || "ROADMAP.md"} in this repository.`;
}

function row(s) {
  const d = el("details"); d.id = "sg-" + s.id;
  const sum = el("summary");
  const t = el("span"); t.append(el("span", "title", s.title), el("span", "goal", `${s.goal.id} ${s.goal.title}`));
  const meta = el("span", "meta");
  const doneTasks = s.tasks.filter(x => x.done).length;
  meta.append(el("span", "tasks-n num", `${doneTasks}/${s.tasks.length} tasks`), el("span", "prio " + s.priority, s.priority), el("span", "pill s-" + s.status, s.status));
  if (state.view === "goal") meta.prepend(el("span", "tag", s.horizon));
  sum.append(el("span", "id", s.id), t, meta);
  const body = el("div", "body"), dl = el("dl");
  FIELDS.forEach(k => { if (s.fields[k]) { const dd = el("dd"); dd.append(rich(s.fields[k])); dl.append(el("dt", null, k), dd); } });
  if (s.needs.length) {
    const dd = el("dd", "needs");
    s.needs.forEach(n => { const b = el("button", null, n); b.type = "button"; b.title = byId[n] ? `${byId[n].title} (${byId[n].status})` : n; b.addEventListener("click", () => reveal(n)); dd.append(b); });
    dl.append(el("dt", null, "Needs"), dd);
  }
  const ul = el("ul");
  s.tasks.forEach(task => { const li = el("li"), box = el("span", "box" + (task.done ? " on" : "")); box.setAttribute("aria-label", task.done ? "Done" : "Open"); const txt = el("span"); txt.append(rich(task.title)); li.append(box, el("span", "id", task.id), txt); ul.append(li); });
  body.append(dl, ul); d.append(sum, body);
  return d;
}

function matches(s) {
  if (state.status === "open" && !OPEN.has(s.status)) return false;
  if (state.status === "decision" && s.status !== "decision") return false;
  if (state.status === "done" && s.status !== "done") return false;
  if (state.horizon && s.horizon !== state.horizon) return false;
  return !state.q || s.text.includes(state.q);
}

function render() {
  document.querySelectorAll("#view button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  document.querySelectorAll(".band").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.horizon === state.horizon)));
  const shown = subs.filter(matches), root = document.getElementById("groups");
  root.replaceChildren();
  document.getElementById("count").textContent = `${shown.length} of ${subs.length} sub-goals`;
  const groups = state.view === "horizon"
    ? HORIZONS.map(([key, name, def]) => ({title: name, note: def, items: shown.filter(s => s.horizon === key).sort((a, b) => PRIO[a.priority] - PRIO[b.priority] || cmpId(a.id, b.id))}))
    : DATA.map(g => ({title: `${g.id}. ${g.title}`, note: "", items: shown.filter(s => s.goal === g).sort((a, b) => cmpId(a.id, b.id))}));
  groups.filter(g => g.items.length).forEach(g => {
    const sec = el("section", "group"), h = el("h2", null, g.title);
    h.append(el("small", null, `${g.items.length} sub-goal${g.items.length === 1 ? "" : "s"}${g.note ? " · " + g.note : ""}`));
    const list = el("div", "list"); g.items.forEach(s => list.append(row(s)));
    sec.append(h, list); root.append(sec);
  });
  if (!shown.length) root.append(el("p", "empty", "No sub-goals match these filters. Clear the search or choose All statuses."));
}

function reveal(id) {
  if (!byId[id]) return;
  state.status = "all"; state.horizon = null; state.q = "";
  document.getElementById("status").value = "all"; document.getElementById("search").value = "";
  render();
  const d = document.getElementById("sg-" + id);
  if (d) { d.open = true; d.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); d.querySelector("summary").focus({preventScroll: true}); }
}

document.querySelectorAll("#view button").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; render(); }));
document.getElementById("status").addEventListener("change", e => { state.status = e.target.value; render(); });
document.getElementById("search").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
renderHeader();
render();
</script>
</body>
</html>
