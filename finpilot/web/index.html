<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="FinPilot financial workspace: accounts, paycheck planning, and a grounded AI assistant."
    />
    <title>FinPilot — Financial workspace</title>
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/assets/workspace.css" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <link rel="stylesheet" href="/assets/assistant.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body data-auth="loading">
    <section id="auth-screen" class="auth-screen" hidden></section>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="masthead-inner">
        <a class="brand" href="#overview"
          ><span class="brand-mark"
            ><svg viewBox="0 0 32 32" aria-hidden="true">
              <path
                d="M8 26V6h18v5H14v4h10v5H14v6Z"
                fill="currentColor"
              /></svg></span
          >FinPilot</a
        >
        <span class="masthead-divider"></span
        ><span class="household-label">Personal workspace</span>
        <div class="masthead-actions">
          <button class="button masthead-ai" data-action="assistant">
            <span data-icon="spark"></span>Ask FinPilot
          </button>
          <span class="prototype-label">Private workspace</span>
          <button
            class="icon-button workspace-refresh"
            data-action="refresh"
            aria-label="Refresh workspace"
          >
            <span data-icon="repeat"></span>
          </button>
          <button
            class="icon-button notification"
            data-detail="alerts"
            aria-label="View items needing review"
          >
            <span data-icon="bell"></span><i hidden></i>
          </button>
          <button
            class="profile"
            data-detail="settings"
            aria-label="Open workspace settings"
          >
            <span class="avatar small" id="household-avatar">H</span
            ><span id="household-name">Your household</span
            ><span data-icon="down"></span>
          </button>
        </div>
      </div>
    </header>
    <aside class="sidebar" aria-label="Main navigation">
      <nav id="navigation"></nav>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            data-action="menu"
            aria-label="Open navigation"
            aria-expanded="false"
            aria-controls="navigation"
          >
            <span data-icon="menu"></span></button
          ><strong id="breadcrumb">Overview</strong>
        </div>
        <button class="button topbar-ask" data-action="assistant">
          <span data-icon="spark"></span>Ask FinPilot
        </button>
      </header>
      <main id="main" tabindex="-1" aria-busy="true">
        <div class="loading-state">
          <span class="loading-dot"></span>
          <h1>Loading your workspace</h1>
          <p>Getting balances, plans, and account details.</p>
        </div>
      </main>
      <footer>
        <span id="footer-status">Connecting to FinPilot</span
        ><span>FinPilot · Simulated payments</span>
      </footer>
    </div>
    <dialog
      id="detail-dialog"
      class="detail-dialog"
      aria-labelledby="detail-title"
    >
      <div class="detail-top">
        <span class="eyebrow">A CLOSER LOOK</span
        ><button
          class="icon-button"
          data-action="close-detail"
          aria-label="Close details"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <dialog
      id="assistant-dialog"
      class="assistant-dialog"
      aria-labelledby="assistant-title"
    ></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
