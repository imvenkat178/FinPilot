<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Memory Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f3f5f7;--sheet:#ffffff;--ink:#16202a;--soft:#5a6674;--rule:#dde3e9;
  --accent:#1d6b74;--accent-wash:#e3f0f1;--amber:#9a6412;--amber-wash:#fbf1df;
  --code-bg:#eef2f5;--code-ink:#1b2a36;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1419;--sheet:#151b22;--ink:#e2e8ee;--soft:#98a4b1;--rule:#26303a;
  --accent:#6cc3cc;--accent-wash:#12292d;--amber:#e0ad5c;--amber-wash:#2b2112;
  --code-bg:#1b232c;--code-ink:#dbe4ec;color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0f1419;--sheet:#151b22;--ink:#e2e8ee;--soft:#98a4b1;--rule:#26303a;
  --accent:#6cc3cc;--accent-wash:#12292d;--amber:#e0ad5c;--amber-wash:#2b2112;
  --code-bg:#1b232c;--code-ink:#dbe4ec;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.65 var(--body);padding-inline:20px;padding-block:28px 72px}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
nav{position:sticky;top:24px;display:grid;gap:14px;font-size:14px}
nav .mark{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;border-left:2px solid var(--rule)}
nav a{display:block;color:var(--soft);text-decoration:none;padding:4px 0 4px 12px;margin-left:-2px;border-left:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.active{color:var(--accent);border-left-color:var(--accent)}
article{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:40px clamp(20px,5vw,56px) 56px;min-width:0}
article>*{max-width:72ch}
article>table,article>pre,article>.prompt{max-width:none}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:1.9em 0 .55em}
h1{font-size:40px;letter-spacing:-.01em;margin-top:0}
h1+p{font-size:19px;color:var(--soft)}
h2{font-size:26px;padding-top:18px;border-top:1px solid var(--rule)}
h3{font-size:19px}
p,ul,ol{margin:0 0 1em}
li{margin:.25em 0}
a{color:var(--accent)}
strong{font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:3px}
pre{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:16px 18px;overflow-x:auto;font:14px/1.6 var(--mono);margin:0 0 1.2em}
pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.table-wrap{overflow-x:auto;margin:0 0 1.4em}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--rule)}
th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);border-bottom:2px solid var(--ink)}
td code{white-space:nowrap}
.copy{position:absolute;top:8px;right:8px;font:500 12px var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.prompt{border:2px solid var(--amber);border-radius:8px;background:var(--amber-wash);padding:18px;margin:0 0 1.4em}
.prompt .label{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-family:var(--display);font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.prompt pre{background:var(--sheet);margin:0;white-space:pre-wrap;max-height:520px;overflow:auto}
.prompt pre code{white-space:pre-wrap}
.prompt .copy{position:static;background:var(--amber);color:var(--sheet);border-color:var(--amber);font-size:13px;padding:6px 14px}
.status{font-size:13px;color:var(--soft);min-height:1.2em}
.fallback{white-space:pre-wrap;font:14px/1.6 var(--mono)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){.shell{grid-template-columns:1fr}nav{position:static}nav ol{display:none}article{padding:28px 18px 40px}h1{font-size:32px}}
</style>
</head>
<body>

<div class="shell">
  <nav aria-label="Contents">
    <span class="mark">Agent memory kit</span>
    <ol id="toc"></ol>
  </nav>
  <article id="doc"><p class="fallback" id="raw"></p></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const MD = /*__KIT_MD__*/"";
const doc = document.getElementById("doc");
if (window.marked && typeof marked.parse === "function") {
  doc.innerHTML = marked.parse(MD, {mangle: false, headerIds: true});
} else {
  document.getElementById("raw").textContent = MD;
}
doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.append(t); });

function copyText(text, button, status) {
  const done = msg => { button.textContent = msg; setTimeout(() => { button.textContent = button.dataset.label; }, 1800); };
  const select = () => { const r = document.createRange(); r.selectNodeContents(button.closest(".prompt, pre").querySelector("code") || button.closest("pre")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected, press Ctrl+C"); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done("Copied"), select); else select();
}

doc.querySelectorAll("pre").forEach(pre => {
  const code = pre.querySelector("code"); if (!code) return;
  const isPrompt = code.classList.contains("language-text") && code.textContent.startsWith("Set up the shared agent memory system");
  const button = document.createElement("button"); button.type = "button"; button.className = "copy";
  button.dataset.label = isPrompt ? "Copy the prompt" : "Copy"; button.textContent = button.dataset.label;
  button.addEventListener("click", () => copyText(code.textContent, button));
  if (isPrompt) {
    const box = document.createElement("div"); box.className = "prompt";
    const label = document.createElement("div"); label.className = "label";
    const title = document.createElement("span"); title.textContent = "Bootstrap prompt, paste into any coding agent";
    label.append(title, button); pre.replaceWith(box); box.append(label, pre);
  } else { pre.append(button); }
});

const toc = document.getElementById("toc");
const heads = [...doc.querySelectorAll("h2")];
heads.forEach(h => { if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-"); const li = document.createElement("li"); const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent; li.append(a); toc.append(li); });
const links = [...toc.querySelectorAll("a")];
const mark = () => { let current = heads[0]; heads.forEach(h => { if (h.getBoundingClientRect().top < 120) current = h; }); links.forEach(a => a.classList.toggle("active", current && a.getAttribute("href") === "#" + current.id)); };
addEventListener("scroll", mark, {passive: true}); mark();
</script>
</body>
</html>
